name: Repro

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            api-level:
                description: Android API level of the emulator
                type: number
                default: 34
            workload-set:
                description: .NET workload set version to install (11.0.100.1 has Microsoft.NET.Sdk.Android 37.2.31)
                type: string
                default: 11.0.100.1

permissions:
    contents: read

concurrency:
    group: repro-${{ github.ref }}
    cancel-in-progress: true

env:
    DOTNET_NOLOGO: 'true'
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    API_LEVEL: ${{ inputs.api-level || '34' }}
    WORKLOAD_SET: ${{ inputs.workload-set || '11.0.100.1' }}

jobs:
    repro:
        name: ${{ matrix.runtime }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                runtime: [coreclr, mono]
        steps:
            -   name: Setup checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Install .NET SDK
                uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
                with:
                    global-json-file: global.json

            -   name: Setup Java
                uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
                with:
                    distribution: 'microsoft'
                    java-version: '21'

            -   name: Install .NET Android workload
                run: |
                    dotnet workload install android --version "$WORKLOAD_SET"
                    dotnet --info
                    dotnet workload list

            -   name: Setup environment record
                run: |
                    mkdir -p "artifacts/${{ matrix.runtime }}"
                    {
                        echo "dotnet: $(dotnet --version)"
                        echo "emulator API level: ${API_LEVEL}"
                        echo "workload set: ${WORKLOAD_SET}"
                        dotnet workload list
                    } | tee "artifacts/${{ matrix.runtime }}/environment.txt"

            -   name: Build app
                run: bash ci/build.sh ${{ matrix.runtime }}

            -   name: Setup KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm --settle
                    # Without a usable /dev/kvm the emulator runs with -accel off, far too slowly
                    if ! { test -r /dev/kvm && test -w /dev/kvm; }; then
                        echo '::error::/dev/kvm is not usable.'
                        exit 1
                    fi

            -   name: Run cases on an emulator
                timeout-minutes: 30
                uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
                with:
                    api-level: ${{ env.API_LEVEL }}
                    target: google_apis
                    arch: x86_64
                    profile: pixel_7_pro
                    cores: 4
                    ram-size: 4096M
                    disk-size: 6000M
                    force-avd-creation: false
                    emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
                    disable-animations: true
                    # One line, because the action runs each script line in its own shell
                    script: bash ci/run-cases.sh ${{ matrix.runtime }}

            -   name: Assert observed results match the expected ones
                if: always()
                run: python3 -I ci/assert-results.py --runtime ${{ matrix.runtime }} --expected ci/expected.json --results artifacts/${{ matrix.runtime }} --versions "artifacts/${{ matrix.runtime }}/versions.txt" --summary "$GITHUB_STEP_SUMMARY"

            -   name: Upload results
                if: always()
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: results-${{ matrix.runtime }}
                    path: artifacts/${{ matrix.runtime }}
                    if-no-files-found: warn
